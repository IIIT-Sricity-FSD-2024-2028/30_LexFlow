<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LexFlow Ã¢â‚¬â€œ Tasks</title>
<link rel="stylesheet" href="../styles/firm-cases.css">
<link rel="stylesheet" href="../styles/shared-form-validation.css">
<link rel="stylesheet" href="../styles/sidebar.css">
</head>
<body>
<div id="sidebar-container"></div>
<div style="flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #fdfdfd;">
<div class="topbar">
<div class="breadcrumb">
<span class="current">Tasks</span>
</div>
<div style="display: flex; gap: 12px; align-items: center;">
</div>
</div>
<main class="tasks-main">
<div class="page-header" style="margin-bottom: 24px;">
  <h1 style="font-size: 28px; font-weight: 800;">My Tasks</h1>
  <p style="color: #6b7280; font-size: 14px; margin-top: 4px;">Monitor and manage all your assigned legal responsibilities.</p>
</div>

<div class="tasks-container card">
<div class="tasks-toolbar">
  <div style="display: flex; gap: 12px;">
    <div class="search-bar" style="margin: 0; min-width: 280px;">
      <span class="search-icon">
        <span class="svg-icon-placeholder" data-icon="icon_37"></span>
      </span>
      <input id="taskSearchInput" type="text" placeholder="Search by name or case..." style="padding: 8px 12px 8px 32px; border-radius: 6px; border: 1px solid #e5e7eb; width: 100%;">
    </div>
  </div>
  <div style="display: flex; gap: 12px;">
    <div class="filter-wrapper" style="position: relative;">
      <button class="filter-btn premium" id="taskFilterBtn">
        <span class="svg-icon-placeholder" data-icon="icon_38"></span>
        Filters
      </button>
      <div id="taskFilterDropdown" style="display:none; position:absolute; background:#fff; border:1px solid #e5e7eb; border-radius:8px; padding:16px; box-shadow:0 10px 15px -3px rgba(0,0,0,0.1); margin-top: 8px; right: 0; z-index: 100; min-width: 180px;">
        <label style="font-size:11px; font-weight:700; color:#9ca3af; text-transform:uppercase; display:block; margin-bottom: 8px;">Priority</label>
        <select id="taskPriorityFilter" class="form-input" style="width: 100%; margin-bottom: 12px; padding: 6px;">
          <option value="All">All Priorities</option>
          <option value="HIGH">High Priority</option>
          <option value="MEDIUM">Medium Priority</option>
          <option value="LOW">Low Priority</option>
        </select>
        <label style="font-size:11px; font-weight:700; color:#9ca3af; text-transform:uppercase; display:block; margin-bottom: 8px;">Status</label>
        <select id="taskStatusFilter" class="form-input" style="width: 100%; padding: 6px;">
          <option value="All">All Statuses</option>
          <option value="Pending">Pending</option>
          <option value="Completed">Completed</option>
        </select>
      </div>
    </div>
  </div>
</div>

<table class="tasks-table">
<thead>
<tr>
<th style="padding-left: 20px;">TASK NAME</th>
<th>TASK ID</th>
<th>ASSIGNED TO</th>
<th>PRIORITY</th>
<th>DUE DATE</th>
<th>STATUS</th>
<th style="padding-right: 20px; text-align: right;">ACTIONS</th>
</tr>
</thead>
<tbody id="tasksTbody">
</tbody>
</table>
<div class="pagination" style="padding: 16px 20px; border-top: 1px solid #f3f4f6; margin: 0;">
<div class="info" id="taskPaginationInfo">Showing 1 to 4 of 28 tasks</div>
<div class="pages" id="taskPaginationPages">
</div>
</div>
</div>
</main>
</div>
<div class="modal-backdrop" id="viewTaskModal">
<div class="modal-content" style="max-width: 500px;">
<div class="modal-header">
<div style="display: flex; align-items: center; gap: 12px;">
<div style="background: #eff6ff; color: #3b5bdb; padding: 8px; border-radius: 8px;">
<span class="svg-icon-placeholder" data-icon="icon_40"></span>
</div>
<div>
<div id="viewTaskId" style="font-size: 11px; font-weight: 700; color: #3b5bdb; text-transform: uppercase;">TASK ID</div>
<div id="viewTaskTitle" style="font-size: 16px; font-weight: 800; color: #1a1a2e;">Task Title</div>
</div>
</div>
</div>
<div class="modal-body">
<div style="display: flex; justify-content: space-between; margin-bottom: 24px;">
<div>
<label class="form-label" style="color: #9ca3af; font-size: 10px;">STATUS</label>
<div id="viewTaskStatus" style="font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px;">
<div class="dot" style="width:6px; height:6px; background:#10b981; border-radius:50%;"></div>
Active
</div>
</div>
<div>
<label class="form-label" style="color: #9ca3af; font-size: 10px;">DUE DATE</label>
<div id="viewTaskDate" style="font-size: 13px; font-weight: 700; color: #1a1a2e;">Aug 24, 2024</div>
</div>
<div>
<label class="form-label" style="color: #9ca3af; font-size: 10px;">PRIORITY</label>
<div id="viewTaskPriority" style="font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 4px; background: #fee2e2; color: #ef4444;">HIGH</div>
</div>
</div>
<div style="margin-bottom: 24px;">
<label class="form-label" style="color: #9ca3af; font-size: 10px;">DESCRIPTION</label>
<p id="viewTaskDesc" style="font-size: 13px; color: #4b5563; line-height: 1.6;">No description provided.</p>
</div>
<div style="padding-top: 16px; border-top: 1px solid #f3f4f6; display: flex; align-items: center; gap: 12px;">
<div id="viewTaskAvatar" style="width: 32px; height: 32px; border-radius: 50%; background: #eef2ff; color: #3b5bdb; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700;">SM</div>
<div>
<div style="font-size: 10px; color: #9ca3af; font-weight: 600;">Assignee</div>
<div id="viewTaskAssignee" style="font-size: 13px; font-weight: 700; color: #1a1a2e;">Sarah Mitchell</div>
</div>
</div>
</div>
<div class="modal-footer">
<button class="btn-outline" onclick="closeModal('viewTaskModal')">Close</button>
<button class="btn-primary" id="completeTaskBtn" onclick="markTaskAsCompleted()">Mark as Completed</button>
</div>
</div>
</div>
<script src="../scripts/auth.js"></script>
<script>AuthService.requireAuth(['firmAdmin', 'lawyer', 'intern']);</script>
<script src="../scripts/shared-form-validation.js"></script>
<script src="../scripts/sidebar.js"></script>
<script src="../scripts/api.js"></script>
<script src="../scripts/lawyer-tasks.js"></script>
<script src="../assets/icons.js"></script>
</body>
</html>
